name: Build installers

# Android, iOS and Windows are all built here from the same commit, and a `v*`
# tag publishes the three of them as one release. The IPA needs Xcode, the MSI
# needs MSVC and WiX, the APKs need the NDK: none of them can be produced on
# the phone this app is for.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: Android (3 ABIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the APKs
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$ANDROID_NDK_HOME" ]; then
            export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)"
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          flutter build apk --release --split-per-abi
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/Misaka-hrt-$version-$abi.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Build the pharmacokinetic core
        run: bash rust/build_ios.sh

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | cut -d+ -f1)
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Build the app bundle
        run: flutter build ios --release --no-codesign

      - name: Package the IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # An unsigned IPA is just a zip of Payload/: AltStore, Sideloadly or
          # Xcode re-sign it with the person's own Apple ID.
          zip -qry "Misaka-hrt-${{ steps.version.outputs.value }}-ios.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          if-no-files-found: error

  windows:
    name: Windows (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pharmacokinetic core
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Build the app
        run: flutter build windows --release

      - name: Install WiX
        run: choco install wixtoolset --no-progress -y

      - name: Package the MSI
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split ':')[1].Trim() -split '\+' | Select-Object -First 1
          ./packaging/windows/build_msi.ps1 -Version $version -OutFile "dist/Misaka-hrt-$version-windows-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Android（三 ABI）、未签名 iOS IPA、Windows MSI 三份安装包，同一个 commit 构建。

            * Android：直接安装 `arm64-v8a`（绝大多数手机）；`armeabi-v7a` 给更老的 32 位机器，`x86_64` 给模拟器。
            * iOS：IPA 未签名，用 AltStore、Sideloadly 或 Xcode 以你自己的 Apple ID 重签。
            * Windows：`windows-x64.msi`，需要 x64 Windows 10 及以上。

            数据全部留在本机，不需要账号，也不联网。
