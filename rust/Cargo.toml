[package]
name = "hrt-pk-core"
version = "2.2.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "The pharmacokinetic core behind this app, shared with every other client"

# The shared object keeps the name the Flutter app loads. The crate itself is
# the same one published as `hrt-pk-core`; `src/` is a copy of that release, so
# a fix made here can be lifted back verbatim.
[lib]
name = "hrt_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
